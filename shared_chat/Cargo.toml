[package]
name = "shared_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

strum = "0.28.0"
strum_macros = "0.28.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.1", features = ["serde"] }
nutype = { version = "0.8.0",  features = ["serde", "regex"] }
regex = "1.13.1"
lazy_static = "1.5.1"
# indexmap = { version = "2.11.0", features = ["serde"] }

anyhow = "1.0.104"
