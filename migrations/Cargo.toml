[package]
name = "migrations"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }

anyhow = "1.0.104"
dotenvy = "0.15.7"

futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
tokio = { version = "1.54.1", features = ["full"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "chrono",
    "uuid",
] }

serde = "1.0.229"
rmp-serde = "1.3.1"
serde_json = "1.0.154"
serde_plain = "1.0.2"

rand = "0.10.3"
strum = "0.28.0"
chrono = "0.4.45"
uuid = { version = "1.29.1", features = ["v4"] }

[features]
default = ["sqlite"]
sqlite = []
postgres = []
