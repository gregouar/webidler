[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
frontend = { path = "../frontend" }
shared = { path = "../shared", features = ["modifiable"] }

anyhow = "1.0.104"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
leptos-use-storage = "0.20.1"
leptos-use-interval-fn = "0.20.1"
leptos-use-watch-debounce-throttle = "0.20.0"
web-sys = { version = "0.3.107", features = ["Performance","Blob","BlobPropertyBag"] }

console_error_panic_hook = "0.1.7"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_plain = "1.0.2"
codee = { version = "0.3.5", features = ["msgpack_serde"] }
strum = "0.28.0"
nutype = { version = "0.8.0",  features = ["serde", "regex"] }

chrono = "0.4.45"
indexmap = "2.14.2"
itertools = "0.15.0"

rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
regex = "1.13.1"
html-escape = "0.3.1"
serde_ignored = "0.1.14"
uuid = { version = "1.29.1", features = ["v4","js"] }
