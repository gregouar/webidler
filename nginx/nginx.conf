proxy_cache_path /var/cache/nginx/master-data
    levels=1:2
    keys_zone=master_data:10m
    max_size=100m
    inactive=1h
    use_temp_path=off;

server {
    listen 80;
    server_name webidler.gregoirenaisse.be;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name webidler.gregoirenaisse.be;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/msgpack text/plain;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    
    # WebSocket chat configuration
    location /chatws {
        proxy_pass http://backend_chat:4242; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
    
    # WebSocket configuration
    location /ws {
        proxy_pass http://backend:4200; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location = /game/master-data {
        proxy_pass http://backend:4200;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip on;
        gzip_min_length 1;
        gzip_proxied any;
        gzip_types application/msgpack;
        gzip_vary on;

        proxy_cache master_data;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1y;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://backend:4200;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    

}


