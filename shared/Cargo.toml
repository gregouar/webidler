[package]
name = "shared"
version = "0.4.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

strum = "0.27.2"
strum_macros = "0.27.2"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.1", features = ["serde"] }
nutype = { version = "0.6.2",  features = ["serde", "regex"] }
regex = "1.13.1"
lazy_static = "1.5.1"
indexmap = { version = "2.14.2", features = ["serde"] }

anyhow = "1.0.104"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.13.4", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.8.3"

[features]
default = []
modifiable = []
