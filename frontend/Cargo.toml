[package]
name = "frontend"
version = "0.4.0"
edition = "2024"

[dependencies]
shared = { path = "../shared", features=[] }
shared_chat = { path = "../shared_chat", features=[] }

anyhow = "1.0.104"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
leptos-use-document = "0.20.0"
leptos-use-mouse = "0.20.1"
leptos-use-mouse-in-element = "0.20.1"
leptos-use-event-listener = "0.20.0"
leptos-use-window-size = "0.20.1"
leptos-use-on-click-outside = "0.20.1"
leptos-use-infinite-scroll = "0.20.1"
leptos-use-interval-fn = "0.20.1"
leptos-use-interval= "0.20.0"
leptos-use-resize-observer = "0.20.0"
leptos-use-storage = "0.20.1"
leptos-use-watch-debounce-throttle = "0.20.0"
leptos-use-websocket = "0.20.2"
web-sys = { version = "0.3.107", features = ["Performance", "Selection", "Storage", "ValidityState"] }
js-sys = "0.3.107"

console_error_panic_hook = "0.1.7"
reqwest = { version = "0.13.5", features = ["json"] }
url = "2.5.8"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_plain = "1.0.2"
codee = { version = "0.3.5", features = ["msgpack_serde"] }
base64 = "0.23.1"
strum = "0.28.0"
nutype = { version = "0.8.0",  features = ["serde", "regex"] }
uuid = { version = "1.29.1", features = ["v4","js"] }

chrono = "0.4.45"
indexmap = "2.14.2"
itertools = "0.15.0"

rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
futures = "0.3.34"
