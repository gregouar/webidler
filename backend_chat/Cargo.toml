[package]
name = "backend_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
shared_chat = { path = "../shared_chat", features=[] }
backend_shared = { path = "../backend_shared", features=[] }

anyhow = "1.0.104"
dotenvy = "0.15.7"

axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.10.3", features = ["typed-header"] }

futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
tokio = { version = "1.54.1", features = ["full"] }

http = "1.5.0"
headers = "0.4.2"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"

serde = "1.0.229"
rmp-serde = "1.3.1"
serde_json = "1.0.154"
serde_plain = "1.0.2"
serde_ignored = "0.1.14"

reqwest = { version = "0.13.5", features = ["json"] }

rand = "0.9.5"
rand_chacha = "0.9.0"
strum = "0.27.2"
chrono = "0.4.45"
uuid = { version = "1.29.1", features = ["v4"] }
regex = "1.13.1"

itertools = "0.14.0"
indexmap = { version = "2.14.2", features = ["serde"] }
dashmap = "6.2.1"

[features]
default = ["sqlite"]
sqlite = []
postgres = []
