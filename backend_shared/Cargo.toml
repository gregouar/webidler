[package]
name = "backend_shared"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

strum = "0.27.2"
strum_macros = "0.27.2"
itertools = "0.14.0"

chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.1", features = ["serde"] }
nutype = { version = "0.6.2",  features = ["serde", "regex"] }

regex = "1.13.1"
aho-corasick = "1.1.5"
unicode-normalization = "0.1.26"

anyhow = "1.0.104"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
